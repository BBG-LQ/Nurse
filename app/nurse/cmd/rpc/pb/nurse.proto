syntax = "proto3";
package nurse;
option go_package = "./nurse";

service nurse {
  rpc CreateNurse            (CreateNurseReq)            returns (CreateNurseResp);
  rpc GetNurse               (GetNurseReq)               returns (GetNurseResp);
  rpc UpdateNurse            (UpdateNurseReq)            returns (UpdateNurseResp);
  rpc ListDispatchableNurses (ListDispatchableNursesReq) returns (ListDispatchableNursesResp);
  rpc SubmitTraining         (SubmitTrainingReq)         returns (SubmitTrainingResp);
  rpc ListTrainingRecords    (ListTrainingRecordsReq)    returns (ListTrainingRecordsResp);
  rpc ListUnqualifiedNurses  (ListUnqualifiedNursesReq)  returns (ListUnqualifiedNursesResp);
  rpc IncrLoad               (IncrLoadReq)               returns (IncrLoadResp);
  rpc DecrLoad               (DecrLoadReq)               returns (DecrLoadResp);
  rpc UpdateScore            (UpdateScoreReq)            returns (UpdateScoreResp);
}

message CreateNurseReq {
  string real_name      = 1;
  string mobile         = 2;
  string license_no     = 3;
  string license_expire = 4;
  repeated string skill_tags = 5;
  string service_area   = 6;
}
message CreateNurseResp { int64 id = 1; }

message GetNurseReq  { int64 id = 1; }
message NurseInfo {
  int64  id             = 1;
  string real_name      = 2;
  string mobile         = 3;
  string license_no     = 4;
  string license_expire = 5;
  repeated string skill_tags = 6;
  string service_area   = 7;
  int32  current_load   = 8;
  double score_avg      = 9;
  int32  status         = 10;
}
message GetNurseResp { NurseInfo info = 1; }

message UpdateNurseReq {
  int64  id             = 1;
  repeated string skill_tags = 2;
  string service_area   = 3;
  int32  status         = 4;
  string license_expire = 5;
}
message UpdateNurseResp { bool ok = 1; }

message ListDispatchableNursesReq {
  string service_type = 1;
  int32  max_load     = 2;
  string area         = 3;
}
message NurseBrief {
  int64  id           = 1;
  string real_name    = 2;
  double score_avg    = 3;
  int32  current_load = 4;
}
message ListDispatchableNursesResp { repeated NurseBrief nurses = 1; }

message SubmitTrainingReq {
  int64  nurse_id    = 1;
  string course_name = 2;
  string exam_month  = 3;
  int32  score       = 4;
}
message SubmitTrainingResp {
  bool  passed        = 1;
  int32 attempt_count = 2;
}

message TrainingInfo {
  int64  id            = 1;
  string course_name   = 2;
  string exam_month    = 3;
  int32  score         = 4;
  int32  attempt_count = 5;
  bool   passed        = 6;
  string created_at    = 7;
}
message ListTrainingRecordsReq  { int64 nurse_id = 1; }
message ListTrainingRecordsResp { repeated TrainingInfo list = 1; }

message ListUnqualifiedNursesReq  { string exam_month = 1; }
message ListUnqualifiedNursesResp { repeated int64 nurse_ids = 1; }

message IncrLoadReq  { int64 nurse_id = 1; int32 delta = 2; }
message IncrLoadResp { bool ok = 1; }
message DecrLoadReq  { int64 nurse_id = 1; int32 delta = 2; }
message DecrLoadResp { bool ok = 1; }

message UpdateScoreReq  { int64 nurse_id = 1; double score_avg = 2; }
message UpdateScoreResp { bool ok = 1; }